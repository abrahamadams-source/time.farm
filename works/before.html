<main><article class="work"><h1>“Before,” 2016–</h1><p class="desc">“Before” is a collection of found “before and after” comparisons from print media with their “afters” taken away. A first selection was published as <em>Before</em> (Inpatient Press, 2016). <a href="https://inpatientpress.bigcartel.com/product/before-by-abraham-adams">Inpatient Press ↗</a></p><figure><img src="../img/before-01.jpg?v=3e3e2d51" width="2400" height="1920" alt="Before and Before, 2026, from “Before" loading="eager"><figcaption>Before and Before, 2026, from “Before.” Found printed images in artist’s frame, 24 × 29 in. Shown in “Egg Tooth,” Old Head, Gainesville.</figcaption></figure><figure><img src="../img/before-02.jpg?v=68e5bf60" width="2398" height="2400" alt="Before, 2016" loading="lazy"><figcaption>Before, 2016. Color photograph, 20 in. square.</figcaption></figure><figure><img src="../img/before-03.jpg?v=04cfe8c7" width="1065" height="1377" alt="Detail" loading="lazy"><figcaption>Detail.</figcaption></figure><figure><img src="../img/before-04.jpg?v=26b4a428" width="1966" height="2400" alt="Before, 2016" loading="lazy"><figcaption>Before, 2016. Color photograph, 20 in. square.</figcaption></figure><figure><img src="../img/before-05.jpg?v=5a12ba63" width="1856" height="2400" alt="Detail" loading="lazy"><figcaption>Detail.</figcaption></figure></article></main>
