<main><article class="work"><h1><em>Nothing in MoMA</em>, 2018</h1><p class="desc"><em>Nothing in MoMA</em> (Punctum Books, 2018) is a series of photographs capturing areas in the Museum of Modern Art where no art, written language, or people were present. <a href="https://punctumbooks.com/titles/nothing-in-moma/">Punctum Books ↗</a></p><figure><img src="../img/nothing-in-moma-01.jpg?v=2169f667" width="2400" height="1600" alt="Nothing in MoMA, 2018" loading="eager"><figcaption>Nothing in MoMA, 2018. Digital color photograph, 20 × 30 cm.</figcaption></figure><figure><img src="../img/nothing-in-moma-02.jpg?v=6d9bb302" width="1489" height="2384" alt="Nothing in MoMA, Punctum Books, 2018" loading="lazy"><figcaption>Nothing in MoMA, Punctum Books, 2018. Artist’s book, 90 pp., 75 figures, 5 × 8 in.</figcaption></figure><figure><img src="../img/nothing-in-moma-03.jpg?v=33c1c281" width="1856" height="2400" alt="Nothing in MoMA, 2018" loading="lazy"><figcaption>Nothing in MoMA, 2018. Digital color photograph, 20 × 30 cm.</figcaption></figure><figure><img src="../img/nothing-in-moma-04.jpg?v=08a52abf" width="2400" height="1800" alt="Nothing in MoMA, 2018" loading="lazy"><figcaption>Nothing in MoMA, 2018. Digital b&amp;w photograph, 20 × 30 cm.</figcaption></figure><figure><img src="../img/nothing-in-moma-05.jpg?v=72560e95" width="1855" height="2400" alt="Detail" loading="lazy"><figcaption>Detail.</figcaption></figure></article></main>
