<main><article class="work"><h1><em>Installation for a Photograph</em>, 2014–15</h1><p class="desc"><em>Installation for a Photograph</em> (with Karin Schneider and John Miller) is an installation built around an original Marilyn by Andy Warhol, on loan through Galerie Barbara Weiss and displayed face-down on the floor.</p><figure><img src="../img/installation-for-a-photograph-01.jpg?v=4fceab44" width="1798" height="2400" alt="Installation for a Photograph, 2014 (with Karin Schneider and John Miller)" loading="eager"><figcaption><em>Installation for a Photograph</em>, 2014–15 (with Karin Schneider and John Miller). Various materials, dimensions variable. Shown in “No Games Inside the Labyrinth,” Galerie Barbara Weiss, Berlin, 2014.</figcaption></figure><figure><img src="../img/installation-for-a-photograph-03.jpg?v=faf816d4" width="1600" height="1169" alt="Installation view" loading="lazy"><figcaption>Installation view, “No Games Inside the Labyrinth,” Galerie Barbara Weiss, Berlin, 2014.</figcaption></figure><figure><img src="../img/installation-for-a-photograph-04.jpg?v=ad0a1994" width="1600" height="1234" alt="Installation view" loading="lazy"><figcaption>Installation view, “No Games Inside the Labyrinth,” Galerie Barbara Weiss, Berlin, 2014.</figcaption></figure></article></main>
